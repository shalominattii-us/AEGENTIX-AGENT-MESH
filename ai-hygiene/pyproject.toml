[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-hygiene"
version = "0.1.0"
description = "Autonomous concurrent AI model hygiene and stabilization"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.scripts]
ai-hygiene = "ai_hygiene.cli:main"

[tool.setuptools.packages.find]
include = ["ai_hygiene*"]
